<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="main-card">

        <h1 id="Heading">BlackJack</h1>
        <p id="message"></p>
        <div class="cards">
            <p>Cards: <span id="card1" class="span-card"></span>  <span id="card2" class="span-card"></span> <span id="newCard"></span>
            </p>
        </div>
        <div class="sum">
            <p class="sum-p">Sum: <span id="sum"></span>
            </p>
        </div>
        <div class="btn">
            <button class="buttons" id="start-button" class="buttons" onclick="startGame()">START GAME</button>
            <button class="buttons" id="newCard" class="buttos" onclick="drawCard()">NEW CARD</button>
        </div>

        <div class="footer-text">
            Per:<span id="price-pool">$100</span>
        </div>
    </div>

    
    <script src="index.js"></script>
</body>
</html>
